<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shot Board — content pipeline</title>
<style>
  :root{
    --bg:#15171c; --surface:#1c1f26; --surface-2:#232730; --line:#2e323d;
    --ink:#e9ebf0; --ink-dim:#9aa1b1; --ink-faint:#646b7d;
    --accent:#5b8cff; --accent-ink:#0f1830;
    --mono:'SF Mono',ui-monospace,'Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --radius:12px;
    /* warming ramp: purple -> magenta -> pink -> red, then green / gray / orange */
    --s-idea:#3f7bff; --s-prompt:#7a5cf0; --s-image:#b34fd6; --s-video:#e8463f;
    --s-done:#2fb37f; --s-paused:#8a8f9c; --s-review:#f0911e;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f3f4f7; --surface:#fff; --surface-2:#f7f8fb; --line:#e3e6ec;
      --ink:#1b1e27; --ink-dim:#5b6273; --ink-faint:#8b91a1; --accent-ink:#fff; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
    line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  body.dragging{user-select:none;-webkit-user-select:none}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent)}

  header{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
  .bar{display:flex;flex-direction:column;gap:9px;padding:9px 14px 11px}
  .hrow1{display:flex;align-items:center;gap:9px}
  .hrow3{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .h-spacer{flex:1}
  @media(min-width:880px){
    .bar{flex-direction:row;align-items:center;flex-wrap:nowrap}
    .hrow1,.hrow3{display:contents}
    .h-spacer{display:none}
    .h-brand{order:1}.h-tabs{order:2}.h-search{order:3;flex:1}
    .h-sort{order:4}.h-filter{order:5}.h-count{order:6}.h-gear{order:9}
  }
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand b{font-weight:600;font-size:17px;letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .tabs{display:flex;gap:4px;margin-left:6px}
  .tab{background:none;border:none;cursor:pointer;color:var(--ink-dim);padding:6px 12px;
    border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .tab.on{background:var(--surface-2);color:var(--ink)}
  .tab svg{width:15px;height:15px}
  .spacer{margin-left:auto}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--s-paused);flex:none}
  .dot.on{background:var(--s-done)} .dot.err{background:var(--s-review)}
  .btn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
    padding:7px 11px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;
    gap:6px;transition:border-color .12s}
  .btn:hover{border-color:var(--ink-faint)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
  .btn svg{width:15px;height:15px}
  .fbadge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;
    font-weight:600;min-width:17px;height:17px;padding:0 5px;display:none;align-items:center;justify-content:center}
  .fbadge.on{display:inline-flex}

  .controls{display:flex;gap:8px;align-items:center;padding:0 16px 11px;flex-wrap:wrap}
  .search{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:9px;padding:0 11px}
  .search input{flex:1;background:none;border:none;outline:none;padding:9px 0}
  .search svg{width:15px;height:15px;color:var(--ink-faint);flex:none}
  .sortsel{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer}
  .meta{font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap}

  main{padding:14px 16px 96px;max-width:1000px;margin:0 auto}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:10px;box-shadow:inset 4px 0 0 var(--sc,var(--line));overflow:hidden}
  .card.dragging{position:fixed;z-index:70;pointer-events:none;opacity:.97;
    box-shadow:0 16px 40px rgba(0,0,0,.5);transform:scale(1.015)}
  .drop-ph{border:1.5px dashed var(--accent);border-radius:var(--radius);margin-bottom:10px;
    background:rgba(91,140,255,.09)}
  .cbar{display:flex;align-items:stretch;padding:0}
  .cleft{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:9px 6px 9px 14px;cursor:grab}
  .cleft:active{cursor:grabbing}
  .cmain{display:flex;align-items:center;gap:8px;min-width:0}
  .cmeta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .fdots{display:inline-flex;gap:5px;align-items:center;flex:none}
  .fdot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink-faint);box-sizing:border-box;flex:none}
  .fdot.on{background:var(--sc);border-color:var(--sc)}
  .sid{font-family:var(--mono);font-size:11px;color:var(--ink-faint);flex:none;letter-spacing:.02em}
  .nm{flex:1;min-width:0;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nm.untitled{color:var(--ink-faint);font-weight:400}
  .pill{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.03em;
    padding:3px 10px;border-radius:999px;text-transform:lowercase;cursor:pointer;border:none;flex:none;
    background:var(--sc);color:var(--bg)}
  .counts{display:flex;gap:9px;flex:none;font-family:var(--mono);font-size:11.5px;color:var(--ink-faint)}
  .ct{display:inline-flex;align-items:center;gap:3px} .ct.has{color:var(--ink-dim)}
  .ct svg{width:14px;height:14px}
  .chev{flex:none;width:54px;align-self:stretch;display:flex;align-items:center;justify-content:center;
    background:none;border:none;border-left:1px solid var(--line);cursor:pointer;color:var(--ink-faint)}
  .chev:hover{color:var(--ink);background:var(--surface-2)} .chev svg{width:26px;height:26px}

  .edit{padding:2px 13px 12px;border-top:1px solid var(--line)}
  .erow{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .sidtag{font-family:var(--mono);font-size:11px;color:var(--ink-faint);flex:none}
  .edit label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-faint);margin:9px 0 3px}
  .edit input[type=text],.edit input[type=url],.edit textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    padding:6px 9px;outline:none}
  .edit input:focus,.edit textarea:focus{border-color:var(--accent)}
  .edit textarea{resize:vertical;min-height:34px}
  .fieldgroup{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:2px 11px 8px;margin-top:9px}
  .fieldgroup .fg{padding-top:3px}
  .fieldgroup textarea{min-height:0;line-height:1.35}
  .fieldgroup label{margin:6px 0 2px}
  .nmedit{flex:1;min-width:0;font-weight:600;font-size:17px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:7px;padding:5px 9px;outline:none}
  .nmedit:focus{border-color:var(--accent)}
  .stars{display:inline-flex;gap:1px;flex:none}
  .star{background:none;border:none;cursor:pointer;padding:1px;line-height:0;color:var(--ink-faint)}
  .star svg{width:15px;height:15px}
  .star.on{color:var(--sc)}
  .star.on svg{fill:var(--sc)}
  .promptbox textarea{font-family:var(--mono);font-size:13px;min-height:46px}
  .nameedit{flex:1;min-width:150px}

  .imghead{display:flex;align-items:center;gap:7px;margin:9px 0 5px;
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
  .imghead svg{width:14px;height:14px}
  .imgrow{display:flex;gap:7px;flex-wrap:wrap}
  .it{position:relative}
  .it img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
  .it .rm{position:absolute;top:-6px;right:-6px;background:var(--s-video);color:#fff;border:none;
    border-radius:50%;width:19px;height:19px;cursor:pointer;font-size:12px;line-height:1}
  .addtile{width:64px;height:64px;border:1px dashed var(--line);border-radius:8px;cursor:pointer;
    color:var(--ink-faint);display:flex;align-items:center;justify-content:center}
  .addtile:hover,.addtile.over{border-color:var(--accent);color:var(--accent)} .addtile svg{width:18px;height:18px}
  .urlin{margin-top:7px;width:100%;background:var(--surface-2);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;outline:none;font-size:13px}
  .del{color:var(--s-video);cursor:pointer;font-size:13px;margin-top:16px;display:inline-flex;align-items:center;gap:6px}
  .del svg{width:15px;height:15px}

  .mood{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;
    padding:14px 16px 96px;max-width:1100px;margin:0 auto}
  .mtile{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);
    aspect-ratio:1;cursor:pointer;background:var(--surface-2)}
  .mtile img{width:100%;height:100%;object-fit:cover;display:block}
  .mtile .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:11.5px;
    background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}

  .empty{text-align:center;padding:70px 20px;color:var(--ink-dim)}
  .empty svg{width:34px;height:34px;color:var(--ink-faint);margin-bottom:10px}
  .empty h3{font-weight:600;margin:0 0 4px;color:var(--ink)}

  .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:45;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:14px;padding:13px 18px;
    font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3);display:inline-flex;align-items:center;gap:7px}
  .fab svg{width:18px;height:18px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom));
    z-index:80;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;
    opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.86);display:flex;
    align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px}

  .scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;
    align-items:flex-end;justify-content:center}
  @media(min-width:640px){.scrim{align-items:center;padding:24px}}
  .sheet{background:var(--surface);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0}
  @media(min-width:640px){.sheet{border-radius:16px}}
  .sheet h2{font-size:18px;font-weight:600;margin:0;padding:16px 18px;position:sticky;top:0;
    background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .form{padding:16px 18px}
  .form label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-faint);margin:13px 0 5px}
  .form label:first-child{margin-top:0}
  .form input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;outline:none;font-family:var(--mono);font-size:13px}
  .form input:focus{border-color:var(--accent)}
  .hint{font-size:12px;color:var(--ink-faint);margin-top:8px;line-height:1.5}
  .sheet-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);
    padding:12px 18px;display:flex;gap:9px;justify-content:flex-end}
  .ico{background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:5px;border-radius:7px;line-height:0}
  .ico:hover{color:var(--ink)} .ico svg{width:18px;height:18px}

  /* status picker + filter chips */
  .statlist{display:flex;flex-direction:column;gap:6px}
  .statrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    font-family:var(--mono);font-size:13px;text-transform:lowercase}
  .statrow:hover{border-color:var(--ink-faint)}
  .statrow.sel{border-color:var(--accent)}
  .statrow .sw{width:13px;height:13px;border-radius:50%;flex:none}
  .statrow .ck{margin-left:auto;color:var(--accent);line-height:0} .statrow .ck svg{width:16px;height:16px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:12px;letter-spacing:.02em;text-transform:lowercase;
    border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;
    cursor:pointer;color:var(--ink-dim);display:inline-flex;align-items:center;gap:6px}
  .chip .sw{width:9px;height:9px;border-radius:50%}
  .chip.on{color:var(--bg);border-color:transparent}

  /* anchored popover (status change + filter, opens at the spot) */
  .pop-backdrop{position:fixed;inset:0;z-index:60}
  .popover{position:fixed;z-index:61;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.42);padding:5px;min-width:188px;
    max-width:240px;max-height:64vh;overflow:auto}
  .poprow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
    background:none;border:none;border-radius:8px;padding:9px 10px;font-family:var(--mono);
    font-size:13px;text-transform:lowercase;color:var(--ink)}
  .poprow:hover{background:var(--surface-2)}
  .poprow .sw{width:12px;height:12px;border-radius:50%;flex:none}
  .poprow.off{color:var(--ink-faint)} .poprow.off .sw{opacity:.4}
  .poprow .ck{margin-left:auto;color:var(--accent);line-height:0} .poprow .ck svg{width:16px;height:16px}
  .pop-sep{height:1px;background:var(--line);margin:5px 6px}
  .poprow.clear{color:var(--ink-faint);justify-content:center;font-size:12px}

  /* output thumbnails on the collapsed bar */
  .barthumbs{display:flex;align-items:center;gap:3px;flex:none}
  .barthumb{width:20px;height:20px;border-radius:5px;object-fit:cover;border:1px solid var(--line)}
  .barmore{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:1px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="hrow1">
      <div class="brand h-brand"><b>Shot Board</b></div>
      <div class="tabs h-tabs">
        <button class="tab on" data-view="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/></svg>Board</button>
        <button class="tab" data-view="mood"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Mood</button>
      </div>
      <span class="h-spacer"></span>
      <button class="btn h-gear" id="cfgBtn" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 8 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H2a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 3.6 8a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H8a1.6 1.6 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V8a1.6 1.6 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="search h-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" type="text" placeholder="Search…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
    <div class="hrow3">
      <select class="sortsel h-sort" id="sort">
        <option value="manual">Manual order</option>
        <option value="name">By name</option>
        <option value="status">By status</option>
        <option value="priority">By priority</option>
        <option value="updated">Recently updated</option>
      </select>
      <button class="btn h-filter" id="filterBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M7 12h10M10 19h4"/></svg>Filter<span class="fbadge" id="fcount"></span></button>
      <span class="meta h-count" id="count"></span>
    </div>
  </div>
</header>

<main id="board"></main>
<div class="mood" id="moodView" style="display:none"></div>

<button class="fab" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>New shot</button>

<input type="file" id="fileInput" accept="image/*" multiple style="display:none">
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://sjjktpnpfdwolihydbdh.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqamt0cG5wZmR3b2xpaHlkYmRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNTIyNjUsImV4cCI6MjA5NzYyODI2NX0.Ig8ikqKYkiTVLJDrlkLZk_6HgE7gLKmOQK-89SWd2Ts";
const sb=supabase.createClient(SB_URL,SB_KEY);
const SB_BUCKET="flames";
const STATUSES = [
  {id:'idea',   label:'idea',   color:'var(--s-idea)'},
  {id:'prompt', label:'prompt', color:'var(--s-prompt)'},
  {id:'image',  label:'image',  color:'var(--s-image)'},
  {id:'video',  label:'video',  color:'var(--s-video)'},
  {id:'done',   label:'done',   color:'var(--s-done)'},
  {id:'paused', label:'paused', color:'var(--s-paused)'},
  {id:'review', label:'review', color:'var(--s-review)'},
];
const FIELDS=[['functions','Functions'],['actions','Actions'],['elements','Elements'],['interactions','Element interactions']];
const STATUS_MAP={in_progress:'video',published:'done'}; // migrate old taxonomy
const LS_DATA='shotboard.data', LS_CFG='shotboard.cfg', LS_UI='shotboard.ui';
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>';

/* ---- fail-safe storage: works even when localStorage is blocked (file://, sandbox) ---- */
const mem={};
function lsGet(k){try{const v=localStorage.getItem(k);if(v!=null)return v;}catch{} return k in mem?mem[k]:null;}
function lsSet(k,v){mem[k]=v;try{localStorage.setItem(k,v);}catch{}}
function load(k,d){try{return {...d,...JSON.parse(lsGet(k)||'{}')}}catch{return d}}
function save(k,v){lsSet(k,JSON.stringify(v))}

let state={shots:[],sha:null};
let cfg=load(LS_CFG,{owner:'',repo:'',branch:'main',path:'data/shots.json',token:''});
let ui=load(LS_UI,{sort:'manual'});
let filter={q:'',statuses:new Set(),prios:new Set()};
let view='board';
let expanded=new Set();

/* ---- Supabase data layer ---- */
let _saveTimer=null, _dirty=new Set();
function persist(){
  save(LS_DATA,{shots:state.shots});           // local mirror (instant, offline-safe)
  if(_pendingDirtyAll){ syncAll(); _pendingDirtyAll=false; return; }
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(flushDirty,600);
}
let _pendingDirtyAll=false;
function markDirty(id){ if(id) _dirty.add(id); }

// push one shot's scalar fields to Supabase
async function pushShot(s){
  try{
    await sb.from('shots').upsert({
      id:s.id, name:s.name||'', status:s.status||'idea', priority:s.priority||0,
      functions:s.functions||'', actions:s.actions||'', elements:s.elements||'',
      interactions:s.interactions||'', latest_prompt:s.latestPrompt||'',
      url:s.url||'', comments:s.comments||''
    });
  }catch(e){ console.warn('pushShot',s.id,e); }
}
async function flushDirty(){
  const ids=[..._dirty]; _dirty.clear();
  for(const id of ids){ const s=state.shots.find(x=>x.id===id); if(s) await pushShot(s); }
}
// full sync: upsert all shots + images (used after structural changes)
async function syncAll(){
  for(const s of state.shots){ await pushShot(s); await syncImages(s); }
}
// sync a shot's image rows (prompt + output) to shot_images
async function syncImages(s){
  try{
    await sb.from('shot_images').delete().eq('shot_id',s.id);
    const rows=[];
    (s.promptImages||[]).forEach((u,i)=>rows.push({shot_id:s.id,url:u,kind:'prompt',position:i}));
    (s.outputImages||[]).forEach((u,i)=>rows.push({shot_id:s.id,url:u,kind:'output',position:i}));
    if(rows.length) await sb.from('shot_images').insert(rows);
  }catch(e){ console.warn('syncImages',s.id,e); }
}
// upload a File to Storage, return public URL
async function uploadToStorage(shotId,file){
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path=`${shotId}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const {error}=await sb.storage.from(SB_BUCKET).upload(path,file,{upsert:true,contentType:file.type});
  if(error){ console.warn('upload',error); return null; }
  return sb.storage.from(SB_BUCKET).getPublicUrl(path).data.publicUrl;
}
// upload a base64 data-URI to Storage (used by S001 migrator), return public URL
async function uploadDataURI(shotId,dataURI,idx){
  const m=/^data:(image\/\w+);base64,(.+)$/s.exec(dataURI); if(!m) return null;
  const mime=m[1], ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[mime]||'jpg';
  const bin=atob(m[2]); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const blob=new Blob([arr],{type:mime});
  const path=`${shotId}/prompt-${idx+1}.${ext}`;
  const {error}=await sb.storage.from(SB_BUCKET).upload(path,blob,{upsert:true,contentType:mime});
  if(error){ console.warn('uploadDataURI',error); return null; }
  return sb.storage.from(SB_BUCKET).getPublicUrl(path).data.publicUrl;
}
// load full state from Supabase
async function loadFromSupabase(){
  const {data:shots,error}=await sb.from('shots').select('*').order('id');
  if(error){ console.warn('loadFromSupabase',error); return null; }
  const {data:imgs}=await sb.from('shot_images').select('*').order('position');
  return shots.map(p=>normalize({
    id:p.id, name:p.name, status:p.status, priority:p.priority,
    functions:p.functions, actions:p.actions, elements:p.elements,
    interactions:p.interactions, latestPrompt:p.latest_prompt,
    url:p.url, comments:p.comments, updatedAt:p.updated_at,
    promptImages:(imgs||[]).filter(i=>i.shot_id===p.id&&i.kind==='prompt').map(i=>i.url),
    outputImages:(imgs||[]).filter(i=>i.shot_id===p.id&&i.kind==='output').map(i=>i.url)
  }));
}
// one-time: migrate any base64 images still embedded in local data → Storage
async function migrateEmbeddedImages(){
  let moved=0;
  for(const s of state.shots){
    for(const g of ['promptImages','outputImages']){
      const arr=s[g]||[];
      for(let i=0;i<arr.length;i++){
        if(typeof arr[i]==='string' && arr[i].startsWith('data:image')){
          const url=await uploadDataURI(s.id,arr[i],i);
          if(url){ arr[i]=url; moved++; }
        }
      }
    }
    if(moved) await syncImages(s);
  }
  if(moved){ toast(`Moved ${moved} image${moved>1?'s':''} to cloud`); persist(); render(); }
}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const statusOf=id=>STATUSES.find(s=>s.id===id)||STATUSES[0];
const statusIdx=id=>{const i=STATUSES.findIndex(s=>s.id===id);return i<0?99:i};
function uid(){const ns=state.shots.map(s=>parseInt((s.id||'').replace(/\D/g,''))||0);return 'S'+String((ns.length?Math.max(...ns):0)+1).padStart(3,'0')}
function touch(s){s.updatedAt=new Date().toISOString(); if(s&&s.id) _dirty.add(s.id);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function normalize(s){
  if(!s.promptImages && !s.outputImages){s.promptImages=s.images||[];s.outputImages=[];}
  s.promptImages=s.promptImages||[]; s.outputImages=s.outputImages||[]; delete s.images;
  if(STATUS_MAP[s.status]) s.status=STATUS_MAP[s.status];
  if(!STATUSES.some(x=>x.id===s.status)) s.status='idea';
  s.priority=Math.max(0,Math.min(3,parseInt(s.priority)||0));
  return s;
}

function visible(){
  return state.shots.filter(s=>{
    if(filter.statuses.size && !filter.statuses.has(s.status)) return false;
    if(filter.prios.size && !filter.prios.has(s.priority||0)) return false;
    if(filter.q){
      const hay=[s.id,s.name,s.functions,s.actions,s.elements,s.interactions,s.latestPrompt,s.comments,s.url].join(' ').toLowerCase();
      if(!hay.includes(filter.q)) return false;
    }
    return true;
  });
}
function ordered(){
  let a=visible();
  if(ui.sort==='name') a=[...a].sort((x,y)=>(x.name||'').localeCompare(y.name||''));
  else if(ui.sort==='status') a=[...a].sort((x,y)=>statusIdx(x.status)-statusIdx(y.status));
  else if(ui.sort==='updated') a=[...a].sort((x,y)=>(y.updatedAt||'').localeCompare(x.updatedAt||''));
  else if(ui.sort==='priority') a=[...a].sort((x,y)=>(y.priority||0)-(x.priority||0));
  return a;
}

function wireCard(card){
  const id=card.dataset.id, s=state.shots.find(x=>x.id===id);
  const pill=card.querySelector('[data-status]'); pill.onclick=()=>openStatusPicker(pill,id);
  card.querySelector('[data-toggle]').onclick=()=>{expanded.has(id)?expanded.delete(id):expanded.add(id);refreshCard(id);};
  card.querySelectorAll('.star').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const i=+b.dataset.p; s.priority=(s.priority===i?0:i); touch(s); persist();
    if(ui.sort==='priority'||filter.prios.size) render(); else refreshCard(id);
  });
  if(expanded.has(id)) wireEditor(id);
}
function refreshCard(id){
  const card=document.querySelector(`.card[data-id="${id}"]`), s=state.shots.find(x=>x.id===id);
  if(!card||!s) return;
  card.style.setProperty('--sc',statusOf(s.status).color);

}

function wireEditor(id){
  const card=document.querySelector(`.card[data-id="${id}"]`); if(!card) return;
  const s=state.shots.find(x=>x.id===id); let t;
  card.querySelectorAll('textarea[data-k],input[data-k]').forEach(el=>{
    el.oninput=()=>{
      s[el.dataset.k]=el.value;
      const d=card.querySelector('.fdot[data-f="'+el.dataset.k+'"]');
      if(d) d.classList.toggle('on', el.value.trim().length>0);
      clearTimeout(t); t=setTimeout(()=>{touch(s);persist();},350);
    };
  });
  card.querySelectorAll('.it img').forEach(img=>img.onclick=()=>lightbox(img.dataset.src));
  card.querySelectorAll('.rm').forEach(b=>b.onclick=async()=>{s[b.dataset.grp].splice(+b.dataset.i,1);touch(s);await syncImages(s);persist();refreshCard(id);});
  card.querySelectorAll('.addtile').forEach(tile=>{
    const g=tile.dataset.grp;
    tile.onclick=()=>{pendingUpload={id,g};const fi=document.getElementById('fileInput');fi.value='';fi.click();};
    tile.ondragover=e=>{e.preventDefault();tile.classList.add('over');};
    tile.ondragleave=()=>tile.classList.remove('over');
    tile.ondrop=e=>{e.preventDefault();tile.classList.remove('over');addFiles(s,g,e.dataTransfer.files,()=>refreshCard(id));};
  });
  card.querySelectorAll('.urlin').forEach(inp=>inp.onkeydown=e=>{
    if(e.key==='Enter'&&inp.value.trim()){s[inp.dataset.grp].push(inp.value.trim());inp.value='';touch(s);syncImages(s);persist();refreshCard(id);}
  });
  card.querySelector('[data-del]').onclick=()=>{
    if(confirm('Delete '+s.id+'?')){state.shots=state.shots.filter(x=>x.id!==id);expanded.delete(id);sb.from('shots').delete().eq('id',id);persist();render();}
  };
}
let pendingUpload=null;
document.getElementById('fileInput').onchange=e=>{
  if(pendingUpload){const{id,g}=pendingUpload,s=state.shots.find(x=>x.id===id);if(s)addFiles(s,g,e.target.files,()=>refreshCard(id));}
  pendingUpload=null; e.target.value='';
};
async function addFiles(s,g,files,cb){
  const imgs=[...files].filter(f=>f.type&&f.type.startsWith('image/'));
  if(!imgs.length){ if(cb)cb(); return; }
  toast(`Uploading ${imgs.length} image${imgs.length>1?'s':''}…`);
  for(const f of imgs){
    const url=await uploadToStorage(s.id,f);
    if(url) s[g].push(url);
  }
  touch(s); await syncImages(s); persist();
  if(cb) cb();
}

/* ---- whole-card drag reorder: grab anywhere except controls ---- */
function enableDrag(){
  const board=document.getElementById('board');
  let st=null, arm=null;
  const NOPE='button,a,input,textarea,select,.pill,.star,.stars,.chev,.counts,.barthumbs,.addtile,.rm,.it,.urlin,label';

  board.addEventListener('pointerdown',e=>{
    if(e.button!=null && e.button!==0) return;
    if(e.target.closest(NOPE)) return;
    const card=e.target.closest('.card'); if(!card) return;
    if(ui.sort!=='manual'){toast('Switch to “Manual order” to reorder');return;}
    const touch=e.pointerType==='touch';
    arm={card,id:e.pointerId,x0:e.clientX,y0:e.clientY,touch,ready:!touch,timer:null};
    if(touch) arm.timer=setTimeout(()=>{if(arm)arm.ready=true;},200); // hold to grab on mobile
    document.addEventListener('pointermove',onPre);
    document.addEventListener('pointerup',cancelPre,{once:true});
  });

  function onPre(e){
    if(!arm) return;
    const dist=Math.hypot(e.clientX-arm.x0,e.clientY-arm.y0);
    if(arm.touch && !arm.ready){ if(dist>10) cancelPre(); return; } // moved first → let it scroll
    if(dist<5) return;                                              // mouse: ignore micro-moves
    begin(e);
  }
  function cancelPre(){
    if(arm&&arm.timer) clearTimeout(arm.timer);
    arm=null; document.removeEventListener('pointermove',onPre);
  }
  function begin(e){
    const card=arm.card, pid=arm.id;
    if(arm.timer) clearTimeout(arm.timer);
    document.removeEventListener('pointermove',onPre); arm=null;
    const rect=card.getBoundingClientRect();
    const ph=document.createElement('div'); ph.className='drop-ph'; ph.style.height=rect.height+'px';
    st={card,ph,dx:e.clientX-rect.left,dy:e.clientY-rect.top};
    card.parentNode.insertBefore(ph,card.nextSibling);
    card.classList.add('dragging');
    card.style.width=rect.width+'px';
    moveCard(e);
    document.body.classList.add('dragging');
    try{card.setPointerCapture(pid);}catch(_){}
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp,{once:true});
  }
  function moveCard(e){ st.card.style.left=(e.clientX-st.dx)+'px'; st.card.style.top=(e.clientY-st.dy)+'px'; }
  function onMove(e){
    if(!st) return;
    e.preventDefault();
    moveCard(e);
    const others=[...board.querySelectorAll('.card:not(.dragging)')];
    let after=null;
    for(const c of others){const r=c.getBoundingClientRect();if(e.clientY < r.top + r.height/2){after=c;break;}}
    if(after) board.insertBefore(st.ph,after); else board.appendChild(st.ph);
  }
  function onUp(){
    if(!st) return;
    const {card,ph}=st;
    card.classList.remove('dragging');
    const sid=card.dataset.id, sh=state.shots.find(x=>x.id===sid);
    card.setAttribute('style', sh?`--sc:${statusOf(sh.status).color}`:'');
    ph.parentNode.insertBefore(card,ph); ph.remove();
    document.body.classList.remove('dragging');
    document.removeEventListener('pointermove',onMove);
    const order=[...board.querySelectorAll('.card')].map(c=>c.dataset.id);
    state.shots.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
    st=null; persist(); toast('Order updated');
  }
}

/* ---- anchored popover: opens right at the element you clicked ---- */
function openPopover(anchor,inner){
  const root=document.getElementById('modalRoot');
  const back=document.createElement('div'); back.className='pop-backdrop';
  const pop=document.createElement('div'); pop.className='popover'; pop.innerHTML=inner;
  root.appendChild(back); root.appendChild(pop);
  const r=anchor.getBoundingClientRect();
  const vw=window.innerWidth, vh=window.innerHeight;
  const pw=pop.offsetWidth||200, ph=pop.offsetHeight||10;
  let left=Math.min(r.left, vw-8-pw); if(left<8) left=8;
  let top=r.bottom+6; if(top+ph>vh-8) top=Math.max(8, r.top-6-ph);
  pop.style.left=left+'px'; pop.style.top=top+'px';
  const close=()=>{pop.remove();back.remove();};
  back.onclick=close;
  return {pop,close};
}

/* ---- status change: anchored popover at the pill ---- */
function openStatusPicker(anchor,id){
  const s=state.shots.find(x=>x.id===id); if(!s) return;
  const rows=STATUSES.map(o=>`<button class="poprow" data-v="${o.id}"><span class="sw" style="background:${o.color}"></span>${o.label}${o.id===s.status?`<span class="ck">${CHECK}</span>`:''}</button>`).join('');
  const {pop,close}=openPopover(anchor,rows);
  pop.querySelectorAll('.poprow').forEach(b=>b.onclick=()=>{
    s.status=b.dataset.v; touch(s); persist(); close();
    if(ui.sort==='status'||filter.statuses.size) render(); else refreshCard(id);
  });
}

function updateFilterBadge(){const b=document.getElementById('fcount');const n=filter.statuses.size+filter.prios.size;b.textContent=n;b.classList.toggle('on',n>0);}
document.getElementById('filterBtn').onclick=()=>{

  const build=()=>STATUSES.map(s=>`<button class="poprow ${filter.statuses.has(s.id)?'':'off'}" data-s="${s.id}"><span class="sw" style="background:${s.color}"></span>${s.label}${filter.statuses.has(s.id)?`<span class="ck">${CHECK}</span>`:''}</button>`).join('')
    +`<div class="pop-sep"></div>`
    +[3,2,1,0].map(p=>`<button class="poprow ${filter.prios.has(p)?'':'off'}" data-p="${p}"><span style="color:var(--s-idea);font-size:12px;width:42px;flex:none">${prioLabel(p)}</span>${filter.prios.has(p)?`<span class="ck">${CHECK}</span>`:''}</button>`).join('')
    +`<div class="pop-sep"></div><button class="poprow clear" data-clear>clear all</button>`;
  const {pop}=openPopover(btn,build());
  const rewire=()=>{
    pop.querySelectorAll('.poprow[data-s]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.s; filter.statuses.has(id)?filter.statuses.delete(id):filter.statuses.add(id);
      pop.innerHTML=build(); rewire(); updateFilterBadge(); render();
    });
    pop.querySelectorAll('.poprow[data-p]').forEach(b=>b.onclick=()=>{
      const p=+b.dataset.p; filter.prios.has(p)?filter.prios.delete(p):filter.prios.add(p);
      pop.innerHTML=build(); rewire(); updateFilterBadge(); render();
    });
    pop.querySelector('[data-clear]').onclick=()=>{filter.statuses.clear();filter.prios.clear();pop.innerHTML=build();rewire();updateFilterBadge();render();};
  };
  rewire();
};

/* mood */
function renderMood(){
  const m=document.getElementById('moodView');
  const all=[];
  state.shots.forEach(s=>s.outputImages.forEach(src=>all.push({src,name:s.name||s.id})));
  if(!all.length){m.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><h3>No output images yet</h3><div>Add output images to your shots and they gather here.</div></div>`;return;}
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  m.innerHTML=`<div style="grid-column:1/-1;display:flex;justify-content:space-between;align-items:center">
      <span class="meta">${all.length} output images</span>
      <button class="btn" id="shuf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Shuffle</button>
    </div>`
    + all.map(x=>`<div class="mtile"><img src="${esc(x.src)}" data-src="${esc(x.src)}" loading="lazy"><span class="cap">${esc(x.name)}</span></div>`).join('');
  m.querySelector('#shuf').onclick=renderMood;
  m.querySelectorAll('.mtile img').forEach(img=>img.onclick=()=>lightbox(img.dataset.src));
}
function lightbox(src){const el=document.createElement('div');el.className='lightbox';el.innerHTML=`<img src="${esc(src)}">`;el.onclick=()=>el.remove();document.body.appendChild(el);}

/* add shot */
document.getElementById('addBtn').onclick=()=>{
  const s=normalize({id:uid(),name:'',status:'idea',functions:'',actions:'',elements:'',interactions:'',latestPrompt:'',url:'',comments:'',promptImages:[],outputImages:[]});
  touch(s); state.shots.unshift(s); expanded.add(s.id); persist();
  ui.sort='manual'; document.getElementById('sort').value='manual'; save(LS_UI,ui);
  render();
  const nc=document.querySelector(`.card[data-id="${s.id}"]`);
  if(nc){
    const hd=document.querySelector('header');
    const top=nc.getBoundingClientRect().top+window.scrollY-(hd?hd.offsetHeight:0)-8;
    const nm=nc.querySelector('.nmedit'); if(nm) nm.focus({preventScroll:true});
    window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
  }
};

/* settings + github sync */
document.getElementById('cfgBtn').onclick=()=>{
  const inner=`
    <label>Board file</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" data-export><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>Export .json</button>
      <button class="btn" data-import><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14"/></svg>Import .json</button>
    </div>
    <div class="hint">Export downloads your whole board. Import loads a board file — it replaces the current board, so export first if you want a backup.</div>
    <div class="pop-sep" style="margin:16px 0"></div>
    <label>Cloud (Supabase)</label>
    <div class="hint">Your board lives in Supabase and syncs automatically with Claude. Every edit saves on its own. Use the buttons below only if something looks out of date.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="btn" data-reload><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>Reload from cloud</button>
      <button class="btn pri" data-pushall><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14"/></svg>Push all to cloud</button>
    </div>`;
  const {sh,close}=openSheet('Settings',inner,`<button class="btn pri" data-x2>Close</button>`);
  sh.querySelector('[data-export]').onclick=()=>exportBoard();
  sh.querySelector('[data-import]').onclick=()=>importBoard(close);
  sh.querySelector('[data-reload]').onclick=async()=>{toast('Reloading…');const fresh=await loadFromSupabase();if(fresh){state.shots=fresh;persist();render();toast('Reloaded '+fresh.length+' shots');}close();};
  sh.querySelector('[data-pushall]').onclick=async()=>{toast('Pushing all…');await syncAll();toast('Pushed '+state.shots.length+' shots');close();};
  sh.querySelector('[data-x2]').onclick=close;
};
function setDot(s){const d=document.getElementById('syncDot');if(!d)return;d.className='dot'+(s==='ok'?' on':s==='err'?' err':'');d.title={ok:'Synced',err:'Sync error',idle:'Connected',cfg:'Add settings'}[s]||''}
function exportBoard(){
  const blob=new Blob([JSON.stringify({shots:state.shots,updatedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='shots.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href); toast('Board exported');
}
function importBoard(done){
  const f=document.createElement('input'); f.type='file'; f.accept='application/json,.json';
  f.onchange=e=>{const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const data=JSON.parse(r.result); const shots=Array.isArray(data)?data:data.shots;
      if(!Array.isArray(shots)) throw new Error('No shots array found');
      if(state.shots.length && !confirm(`Replace the current board (${state.shots.length} shots) with ${shots.length} imported shots?`)) return;
      state.shots=shots.map(normalize); state.sha=null; persist(); render();
      if(done) done(); toast('Imported '+state.shots.length+' shots');
    }catch(err){ toast('Import failed: '+err.message); } };
    r.readAsText(file);
  };
  f.click();
}
function ghApi(){if(!cfg.owner||!cfg.repo||!cfg.token)throw new Error('Add owner, repo and token in settings first.');return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`}
function hd(){return {Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json'}}
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s)));
async function pull(silent){try{
  const r=await fetch(`${ghApi()}?ref=${cfg.branch}&t=${Date.now()}`,{headers:hd()});
  if(r.status===404){if(!silent)toast('No data file yet — Push to create it');setDot('idle');return;}
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json(),data=JSON.parse(dec(j.content));
  state.shots=(data.shots||[]).map(normalize);state.sha=j.sha;persist();render();if(view==='mood')renderMood();
  setDot('ok');if(!silent)toast('Pulled '+state.shots.length+' shots');
}catch(e){setDot('err');if(!silent)toast(e.message)}}
async function push(){try{setDot('idle');
  try{const h=await fetch(`${ghApi()}?ref=${cfg.branch}&t=${Date.now()}`,{headers:hd()});if(h.ok)state.sha=(await h.json()).sha;else if(h.status===404)state.sha=null;}catch{}
  const body={message:`Update shot board (${state.shots.length} shots)`,content:enc(JSON.stringify({shots:state.shots,updatedAt:new Date().toISOString()},null,2)),branch:cfg.branch};
  if(state.sha)body.sha=state.sha;
  const r=await fetch(ghApi(),{method:'PUT',headers:{...hd(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('GitHub '+r.status+' — '+(await r.text()).slice(0,80));
  state.sha=(await r.json()).content.sha;setDot('ok');toast('Pushed to GitHub ✓');
}catch(e){setDot('err');toast(e.message)}}
</script>
