<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1815"/>
      <stop offset="1" stop-color="#0b0a09"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ff5e2b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5e2b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded tile background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- back card: spades, tilted left -->
  <g transform="rotate(-16 256 300)">
    <rect x="150" y="150" width="190" height="270" rx="22" fill="#141210" stroke="#3a352f" stroke-width="5"/>
    <!-- spade -->
    <g fill="#e9e2d8">
      <path d="M245 210
               C245 250 200 262 200 300
               a26 26 0 0 0 45 18
               c-4 18 -12 26 -20 32
               h40
               c-8 -6 -16 -14 -20 -32
               a26 26 0 0 0 45 -18
               c0 -38 -45 -50 -45 -90 Z"
            transform="translate(0 -6) scale(1)"/>
    </g>
    <text x="172" y="192" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#e9e2d8" text-anchor="middle">A</text>
    <text x="318" y="408" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#e9e2d8" text-anchor="middle" transform="rotate(180 318 396)">A</text>
  </g>

  <!-- front card: hearts in ember, tilted right, overlapping -->
  <g transform="rotate(14 256 300)">
    <rect x="180" y="135" width="190" height="270" rx="22" fill="#1c1714" stroke="#5a2418" stroke-width="5"/>
    <!-- flame-heart -->
    <g fill="#ff5e2b">
      <path d="M275 200
               c-22 -30 -70 -20 -70 22
               c0 40 70 78 70 78
               s70 -38 70 -78
               c0 -42 -48 -52 -70 -22 Z"/>
    </g>
    <text x="202" y="178" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#ff5e2b" text-anchor="middle">A</text>
    <text x="348" y="394" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#ff5e2b" text-anchor="middle" transform="rotate(180 348 382)">A</text>
  </g>
</svg>
